<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Profile - Parkify</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div class="max-w-5xl mx-auto p-6">

    <div class="bg-white rounded-2xl shadow-sm border p-8">

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-800">
                Owner Profile
            </h1>

            <p class="text-slate-500 mt-2">
                Complete your business profile information.
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="grid md:grid-cols-2 gap-6">

                <div>
                    <label class="block mb-2 font-medium">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        required>
                </div>

                <div>
                    <label class="block mb-2 font-medium">
                        Company Name
                    </label>

                    <input
                        type="text"
                        name="company_name"
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        required>
                </div>

                <div>
                    <label class="block mb-2 font-medium">
                        Registration Number
                    </label>

                    <input
                        type="text"
                        name="registration_no"
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        required>
                </div>

                <div>
                    <label class="block mb-2 font-medium">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        required>
                </div>

            </div>

            <div class="mt-6">

                <label class="block mb-2 font-medium">
                    Business Address
                </label>

                <textarea
                    name="address"
                    rows="4"
                    class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    required></textarea>

            </div>

            <div class="mt-8">

                <button
                    type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-medium">
                    Save Profile
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
