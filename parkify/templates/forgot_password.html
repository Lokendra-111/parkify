{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Parkify</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md bg-white rounded-2xl shadow-sm border p-8">

    <h1 class="text-2xl font-bold text-center mb-2">Forgot Password</h1>
    <p class="text-slate-500 text-center mb-6">Enter your registered email to receive a reset link.</p>

    {% if messages %}
    <div class="mb-6 space-y-2">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-xl {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <input type="email" name="email" required placeholder="Email Address"
               class="w-full border rounded-xl px-4 py-3">

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-medium">
            Send Reset Link
        </button>
    </form>

    <a href="{% url 'authentication' %}" class="block text-center text-slate-500 hover:text-emerald-600 mt-6 text-sm">
        &larr; Back to Login
    </a>

</div>

</body>
</html>
