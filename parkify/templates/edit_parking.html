{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Parking | Parkify</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div class="max-w-3xl mx-auto p-6">

    <div class="mb-8">
        <a href="{% url 'my_parking_lots' %}" class="text-emerald-600 font-medium">&larr; Back to My Parking Lots</a>
        <h1 class="text-3xl font-bold mt-2">Edit Parking Lot</h1>
        <p class="text-slate-500">Update the details of {{ parking.parking_name }}.</p>
    </div>

    {% if messages %}
    <div class="mb-6 space-y-2">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-xl {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="bg-white rounded-2xl shadow-sm border p-6 space-y-5">
        {% csrf_token %}

        {% if parking.parking_image %}
        <img src="{{ parking.parking_image.url }}" class="w-full h-48 object-cover rounded-xl">
        {% endif %}

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Parking Name</label>
            <input type="text" name="parking_name" value="{{ parking.parking_name }}" required class="w-full border rounded-xl px-4 py-3">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Replace Image (optional)</label>
            <input type="file" name="parking_image" accept="image/*" class="w-full border rounded-xl px-4 py-3">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Location / Address</label>
            <input type="text" name="location" value="{{ parking.location }}" required class="w-full border rounded-xl px-4 py-3">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Latitude</label>
                <input type="text" name="latitude" value="{{ parking.latitude|default_if_none:'' }}" class="w-full border rounded-xl px-4 py-3">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Longitude</label>
                <input type="text" name="longitude" value="{{ parking.longitude|default_if_none:'' }}" class="w-full border rounded-xl px-4 py-3">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Google Maps Link (optional)</label>
            <input type="url" name="map_link" value="{{ parking.map_link|default_if_none:'' }}" class="w-full border rounded-xl px-4 py-3">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Car Capacity</label>
                <input type="number" name="car_capacity" min="0" value="{{ parking.car_capacity }}" required class="w-full border rounded-xl px-4 py-3">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Bike Capacity</label>
                <input type="number" name="bike_capacity" min="0" value="{{ parking.bike_capacity }}" required class="w-full border rounded-xl px-4 py-3">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Rate per Hour (Rs)</label>
            <input type="number" step="0.01" name="rate_per_hour" min="0" value="{{ parking.rate_per_hour }}" required class="w-full border rounded-xl px-4 py-3">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Description</label>
            <textarea name="description" rows="4" required class="w-full border rounded-xl px-4 py-3">{{ parking.description }}</textarea>
        </div>

        <label class="flex items-center gap-2">
            <input type="checkbox" name="is_active" {% if parking.is_active %}checked{% endif %} class="w-5 h-5">
            <span class="text-slate-700">Active (visible to users for booking)</span>
        </label>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium">
            Update Parking Lot
        </button>

    </form>

</div>

</body>
</html>
