{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Parking | Parkify</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div class="max-w-3xl mx-auto p-6">

    <div class="mb-8">
        <a href="{% url 'owner_dashboard' %}" class="text-emerald-600 font-medium">&larr; Back to Dashboard</a>
        <h1 class="text-3xl font-bold mt-2">Add New Parking Lot</h1>
        <p class="text-slate-500">Fill in the details below to list a new parking space.</p>
    </div>

    {% if messages %}
    <div class="mb-6 space-y-2">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-xl {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="bg-white rounded-2xl shadow-sm border p-6 space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Parking Name</label>
            <input type="text" name="parking_name" required class="w-full border rounded-xl px-4 py-3">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Parking Image</label>
            <input type="file" name="parking_image" accept="image/*" class="w-full border rounded-xl px-4 py-3">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Location / Address</label>
            <input type="text" name="location" required class="w-full border rounded-xl px-4 py-3">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Latitude</label>
                <input type="text" name="latitude" placeholder="e.g. 27.7172" class="w-full border rounded-xl px-4 py-3">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Longitude</label>
                <input type="text" name="longitude" placeholder="e.g. 85.3240" class="w-full border rounded-xl px-4 py-3">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Google Maps Link (optional)</label>
            <input type="url" name="map_link" class="w-full border rounded-xl px-4 py-3">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Car Capacity</label>
                <input type="number" name="car_capacity" min="0" required class="w-full border rounded-xl px-4 py-3">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Bike Capacity</label>
                <input type="number" name="bike_capacity" min="0" required class="w-full border rounded-xl px-4 py-3">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Rate per Hour (Rs)</label>
            <input type="number" step="0.01" name="rate_per_hour" min="0" required class="w-full border rounded-xl px-4 py-3">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Description</label>
            <textarea name="description" rows="4" required class="w-full border rounded-xl px-4 py-3"></textarea>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-medium">
            Save Parking Lot
        </button>

    </form>

</div>

</body>
</html>
